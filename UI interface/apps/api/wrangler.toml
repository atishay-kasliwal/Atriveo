name = "job-tracker-api"
main = "src/index.ts"
compatibility_date = "2025-02-22"

[vars]
APP_ENV = "development"
SIGNUPS_ENABLED = "true"
# Forgot password email setup:
# EMAIL_FROM = "noreply@atriveo.com"
# RESET_PASSWORD_URL_BASE = "http://localhost:5173/?token="
# PASSWORD_RESET_TOKEN_TTL_MINUTES = "10"
# Optional for signed media URLs:
# MEDIA_URL_SIGNING_SECRET = "set-a-strong-secret"
# Optional if bucket is public via custom domain:
# MEDIA_PUBLIC_BASE_URL = "https://media.example.com"

# Optional R2 binding (recommended for image storage):
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "atriveo-media"
# preview_bucket_name = "atriveo-media-dev"

# Local development config:
# - Put secrets in `apps/api/.dev.vars` (Wrangler reads it automatically for `wrangler dev`)
# - For production use `wrangler secret put ...`

[env.staging]
name = "job-tracker-api-staging"

[env.staging.vars]
APP_ENV = "staging"
SIGNUPS_ENABLED = "true"

[env.production]
name = "job-tracker-api"

[env.production.vars]
APP_ENV = "production"
SIGNUPS_ENABLED = "true"

[env.production.triggers]
# 10:30 PM ET one-time  |  8:00 PM ET daily  |  8:30 PM ET catchup 1  |  9:00 PM ET catchup 2
crons = ["30 2 * * *", "0 0 * * *", "30 0 * * *", "0 1 * * *"]
