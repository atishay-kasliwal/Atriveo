name: Configure Tracker Domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create tracker CNAME when absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          api='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          zones_response="$(curl --fail-with-body --silent --show-error \
            "${api}/zones?name=atriveo.com&account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            -H "${auth_header}" \
            -H 'Content-Type: application/json')"
          zone_id="$(jq -r '.result[0].id // empty' <<<"${zones_response}")"
          if [[ -z "${zone_id}" ]]; then
            echo 'Unable to resolve the atriveo.com zone.' >&2
            exit 1
          fi

          records_response="$(curl --fail-with-body --silent --show-error \
            "${api}/zones/${zone_id}/dns_records?type=CNAME&name=tracker.atriveo.com" \
            -H "${auth_header}" \
            -H 'Content-Type: application/json')"
          record_count="$(jq -r '.result | length' <<<"${records_response}")"

          if [[ "${record_count}" == '0' ]]; then
            create_response="$(curl --fail-with-body --silent --show-error \
              -X POST "${api}/zones/${zone_id}/dns_records" \
              -H "${auth_header}" \
              -H 'Content-Type: application/json' \
              --data '{"type":"CNAME","name":"tracker.atriveo.com","content":"noobly.pages.dev","ttl":1,"proxied":true,"comment":"Atriveo Tracker Cloudflare Pages hostname"}')"
            jq -e '.success == true' <<<"${create_response}" >/dev/null
            echo 'Created tracker.atriveo.com CNAME.'
            exit 0
          fi

          existing_content="$(jq -r '.result[0].content' <<<"${records_response}")"
          existing_proxied="$(jq -r '.result[0].proxied' <<<"${records_response}")"
          if [[ "${existing_content}" != 'noobly.pages.dev' || "${existing_proxied}" != 'true' ]]; then
            echo "An unexpected tracker.atriveo.com DNS record already exists: ${existing_content}, proxied=${existing_proxied}" >&2
            exit 1
          fi

          echo 'tracker.atriveo.com already has the expected CNAME.'
