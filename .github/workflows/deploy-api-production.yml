name: Deploy Production Stack

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production-stack
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "UI interface/package-lock.json"

      - name: Install dependencies
        working-directory: "UI interface"
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: "UI interface"
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run production DB migrations
        working-directory: "UI interface"
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy API to Cloudflare Workers (production)
        working-directory: "UI interface"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:api:prod

      - name: Build frontend (production)
        working-directory: "UI interface"
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
          PRODUCTION_GOOGLE_CLIENT_IDS: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_IDS }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          RAW_GOOGLE_CLIENT_IDS="${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-${PRODUCTION_GOOGLE_CLIENT_IDS:-${GOOGLE_CLIENT_IDS:-}}}}"
          RESOLVED_GOOGLE_CLIENT_ID="$(printf '%s' "${RAW_GOOGLE_CLIENT_IDS}" | awk -F',' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}')"
          VITE_API_URL="${VITE_API_URL:-https://job-tracker-api.katishay.workers.dev}" \
          VITE_GOOGLE_CLIENT_ID="${RESOLVED_GOOGLE_CLIENT_ID}" \
          VITE_GA_MEASUREMENT_ID="${VITE_GA_MEASUREMENT_ID:-}" \
          npm run build:web

      - name: Deploy frontend to Cloudflare Pages (master)
        working-directory: "UI interface"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          PROJECT_NAME="${CLOUDFLARE_PAGES_PROJECT_NAME:-noobly}"
          MAX_ATTEMPTS=5
          ATTEMPT=1
          until [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; do
            echo "Cloudflare Pages deploy attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            if npx wrangler pages deploy "apps/web/dist" --project-name "$PROJECT_NAME" --branch master; then
              exit 0
            fi
            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Cloudflare Pages deploy failed after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            SLEEP_SECONDS=$((ATTEMPT * 15))
            echo "Deploy attempt failed. Retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
            ATTEMPT=$((ATTEMPT + 1))
          done
